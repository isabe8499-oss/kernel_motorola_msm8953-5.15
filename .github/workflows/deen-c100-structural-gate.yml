name: Deen C100 source and DTB structural gate

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Experimental source branch
        required: true
        default: deen/c100-schema-reconcile-v2
  push:
    paths:
      - 'bootstrap/DEEN_C100_STRUCTURAL_GATE'

permissions:
  contents: read

jobs:
  structural-dtb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu libssl-dev libelf-dev device-tree-compiler python3

      - name: Fetch experimental source branch
        id: source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch || 'deen/c100-schema-reconcile-v2' }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$SOURCE_BRANCH" https://github.com/${GITHUB_REPOSITORY}.git "$RUNNER_TEMP/deen-src"
          SOURCE_SHA="$(git -C "$RUNNER_TEMP/deen-src" rev-parse HEAD)"
          echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Experimental source: $SOURCE_BRANCH @ $SOURCE_SHA"

      - name: Assert source CPU and cache inventory
        run: |
          set -euo pipefail
          DTS="$RUNNER_TEMP/deen-src/arch/arm64/boot/dts/qcom/msm8953.dtsi"
          test "$(grep -Ec 'CPU[0-7]: cpu@' "$DTS")" -eq 8
          test "$(grep -c 'l1-icache' "$DTS")" -eq 8
          test "$(grep -c 'l1-dcache' "$DTS")" -eq 8
          test "$(grep -Ec 'L2_[01]: l2-cache_' "$DTS")" -eq 2
          test "$(grep -c 'cache-level = <2>;' "$DTS")" -eq 2
          test "$(grep -c 'cache-unified;' "$DTS")" -eq 2
          echo "source cpu/cache inventory PASS"

      - name: Compile PVT1 and PVT2 DTBs
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/deen-src"
          OUT="$RUNNER_TEMP/deen-out"
          mkdir -p "$OUT"
          make -C "$SRC" O="$OUT" ARCH=arm64 defconfig
          # Preserve the DTC/preprocessor command and preprocessed .dts when
          # compilation fails, so unresolved-label issues can be diagnosed.
          set +e
          make -C "$SRC" O="$OUT" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- V=1 -j1 \
            qcom/msm8953-motorola-deen-pvt1.dtb \
            qcom/msm8953-motorola-deen-pvt2.dtb \
            2>&1 | tee "$RUNNER_TEMP/c100-structural-build.log"
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$RUNNER_TEMP/c100-debug"
          find "$OUT/arch/arm64/boot/dts/qcom" -maxdepth 1 \
            \( -name 'msm8953-motorola-deen-pvt*.dts' -o -name 'msm8953-motorola-deen-pvt*.dtb' -o -name '*.cmd' \) \
            -exec cp -t "$RUNNER_TEMP/c100-debug" {} + 2>/dev/null || true
          find "$SRC/arch/arm64/boot/dts/qcom" -maxdepth 1 \
            -name 'msm8953-motorola-deen-pvt*.dts' -exec cp -t "$RUNNER_TEMP/c100-debug" {} +
          if [[ "$status" -ne 0 ]]; then
            echo "DTC build failed; debug files preserved for diagnosis."
            exit "$status"
          fi

      - name: Verify compiled FDT node inventory and identity
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/deen-out/arch/arm64/boot/dts/qcom"
          P1="$OUT/msm8953-motorola-deen-pvt1.dtb"
          P2="$OUT/msm8953-motorola-deen-pvt2.dtb"
          for p in "$P1" "$P2"; do test -s "$p"; done
          for cpu in 0 1 2 3 100 101 102 103; do
            fdtget -l "$P1" /cpus | grep -Fx "cpu@$cpu"
          done
          for cpu in 0 1 2 3 100 101 102 103; do
            CPU_PATH="/cpus/cpu@$cpu"
            test "$(fdtget -l "$P1" "$CPU_PATH" | grep -Ec '^l1-(icache|dcache)
          test "$(fdtget -t x "$P1" / qcom,board-id)" = "4d c100"
          test "$(fdtget -t x "$P2" / qcom,board-id)" = "4d c200"
          test "$(fdtget -t x "$P1" /cpus/l2-cache_0 cache-level)" = "2"
          test "$(fdtget -t x "$P1" /cpus/l2-cache_1 cache-level)" = "2"
          fdtget "$P1" /cpus/l2-cache_0 compatible
          sha256sum "$P1" "$P2" | tee "$RUNNER_TEMP/deen-dtb-hashes.txt"

      - name: Upload structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: deen-c100-structural-dtb-evidence
          path: |
            ${{ runner.temp }}/deen-dtb-hashes.txt
            ${{ runner.temp }}/c100-structural-build.log
            ${{ runner.temp }}/c100-debug/**
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dtb
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dtb
)" -eq 2
          done
          test "$(fdtget -l "$P1" /cpus | grep -Ec '^l2-cache_[01]
          test "$(fdtget -t x "$P1" / qcom,board-id)" = "4d c100"
          test "$(fdtget -t x "$P2" / qcom,board-id)" = "4d c200"
          test "$(fdtget -t x "$P1" /cpus/l2-cache_0 cache-level)" = "2"
          test "$(fdtget -t x "$P1" /cpus/l2-cache_1 cache-level)" = "2"
          fdtget "$P1" /cpus/l2-cache_0 compatible
          sha256sum "$P1" "$P2" | tee "$RUNNER_TEMP/deen-dtb-hashes.txt"

      - name: Upload structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: deen-c100-structural-dtb-evidence
          path: |
            ${{ runner.temp }}/deen-dtb-hashes.txt
            ${{ runner.temp }}/c100-structural-build.log
            ${{ runner.temp }}/c100-debug/**
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dtb
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dtb
)" -eq 2
          fdtget "$P1" /cpus/l2-cache_0 cache-unified
          fdtget "$P1" /cpus/l2-cache_1 cache-unified
          test "$(fdtget -t x "$P1" / qcom,msm-id)" = "125 0"
          test "$(fdtget -t x "$P1" / qcom,board-id)" = "4d c100"
          test "$(fdtget -t x "$P2" / qcom,board-id)" = "4d c200"
          test "$(fdtget -t x "$P1" /cpus/l2-cache_0 cache-level)" = "2"
          test "$(fdtget -t x "$P1" /cpus/l2-cache_1 cache-level)" = "2"
          fdtget "$P1" /cpus/l2-cache_0 compatible
          sha256sum "$P1" "$P2" | tee "$RUNNER_TEMP/deen-dtb-hashes.txt"

      - name: Upload structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: deen-c100-structural-dtb-evidence
          path: |
            ${{ runner.temp }}/deen-dtb-hashes.txt
            ${{ runner.temp }}/c100-structural-build.log
            ${{ runner.temp }}/c100-debug/**
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dtb
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dtb
