name: ACK 5.15 SMSM SMEM payload bounds and dimensions (host-only)

on:
  push:
    branches:
      - fix/ack515-smsm-shared-item-bounds-20261119
  pull_request:
    branches:
      - fix/ack515-qcom-smsm-local-host-bounds-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smsm-smem-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout ACK 5.15 derived source
        uses: actions/checkout@v4
      - name: Install LLVM 18 and Kbuild dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex make python3 libssl-dev libelf-dev \
            clang-18 llvm-18 lld-18 gcc-aarch64-linux-gnu
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Run new payload checks and prior local host regression
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smsm-smem-bounds"
          git rev-parse HEAD > "$RUNNER_TEMP/smsm-smem-bounds/sha.txt"
          python3 -m unittest discover -s scripts \
            -p 'test_qcom_smsm_shared_item_bounds.py' -v \
            2>&1 | tee "$RUNNER_TEMP/smsm-smem-bounds/new-tests.log"
          python3 -m unittest discover -s scripts \
            -p 'test_qcom_smsm_local_host_bounds.py' -v \
            2>&1 | tee "$RUNNER_TEMP/smsm-smem-bounds/pr25-regression.log"
      - name: Compile production SMSM source as ARM64 Clang18 LTO object
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          OUT="$RUNNER_TEMP/smsm-smem-bounds-out"
          LOG="$RUNNER_TEMP/smsm-smem-bounds"
          mkdir -p "$OUT"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig \
            2>&1 | tee "$LOG/gki-defconfig.log"
          scripts/config --file "$OUT/.config" \
            -e QCOM_SMEM -e QCOM_SMSM -d QCOM_APCS_IPC
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$LOG/olddefconfig.log"
          grep -Fxq 'CONFIG_QCOM_SMEM=y' "$OUT/.config"
          grep -Fxq 'CONFIG_QCOM_SMSM=y' "$OUT/.config"
          grep -Fxq 'CONFIG_LTO_CLANG_FULL=y' "$OUT/.config"
          grep -Fxq 'CONFIG_CFI_CLANG=y' "$OUT/.config"
          if grep -Fxq 'CONFIG_QCOM_APCS_IPC=y' "$OUT/.config"; then
            echo "FAIL_UNEXPECTED_APCS_ENABLEMENT"; exit 3
          fi
          cp "$OUT/.config" "$LOG/smsm-build.config"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j2 \
            drivers/soc/qcom/smsm.o \
            2>&1 | tee "$LOG/build.log"
          test -s "$OUT/drivers/soc/qcom/smsm.o"
          file "$OUT/drivers/soc/qcom/smsm.o" \
            | tee "$LOG/object-type.txt"
          grep -Eiq 'LLVM.*bitcode|ELF.*(aarch64|ARM64)' "$LOG/object-type.txt"
          sha256sum "$OUT/drivers/soc/qcom/smsm.o" > "$LOG/object.sha256"
          echo 'PASS_SMSM_SHARED_ITEM_BOUNDS_ARM64_OBJECT_ONLY_RUNTIME_HOLD' \
            | tee "$LOG/gate.txt"
      - name: Preserve tests and logs (no firmware, kernel Image, or boot partition)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ack515-smsm-smem-bounds-logs-only
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/smsm-smem-bounds/*.log
            ${{ runner.temp }}/smsm-smem-bounds/*.txt
            ${{ runner.temp }}/smsm-smem-bounds/*.config
            ${{ runner.temp }}/smsm-smem-bounds/*.sha256
