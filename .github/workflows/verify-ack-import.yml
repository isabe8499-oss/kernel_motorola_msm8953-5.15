name: Independently verify ACK 5.15 LTS import

on:
  push:
    branches: ["main"]
    paths:
      - "documentation/ACK_IMPORT_LOCK.md"
  workflow_run:
    workflows:
      - Import full Android Common Kernel 14-5.15 LTS history
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-ack-515-import
  cancel-in-progress: false

jobs:
  verify-import:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify permanent refs and Git object integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify source lock, permanent refs, staging cleanup and history
        env:
          EXPECTED_ACK_SHA: 5cb316cf9d39318326075731e4e0c39b725d9c99
        shell: bash
        run: |
          set -euo pipefail

          grep -F -- "$EXPECTED_ACK_SHA" documentation/ACK_IMPORT_LOCK.md >/dev/null || {
            echo "::error::The import lock does not contain the expected upstream SHA."
            exit 1
          }

          verify_ref() {
            local remote_ref="$1"
            local local_ref="$2"
            local remote_sha
            local fetched_sha

            remote_sha="$(git ls-remote origin "$remote_ref" | awk 'NR == 1 {print $1}')"
            if [[ "$remote_sha" != "$EXPECTED_ACK_SHA" ]]; then
              echo "::error::$remote_ref points to '${remote_sha:-missing}', expected $EXPECTED_ACK_SHA."
              exit 1
            fi

            git fetch --no-tags origin "$remote_ref:$local_ref"
            fetched_sha="$(git rev-parse "$local_ref^{commit}")"
            if [[ "$fetched_sha" != "$EXPECTED_ACK_SHA" ]]; then
              echo "::error::Fetched $remote_ref resolved to $fetched_sha, expected $EXPECTED_ACK_SHA."
              exit 1
            fi
            echo "Verified $remote_ref -> $fetched_sha"
          }

          verify_ref \
            "refs/heads/upstream/android14-5.15-lts" \
            "refs/remotes/verify/upstream/android14-5.15-lts"

          verify_ref \
            "refs/heads/deen/bringup-ack515-base" \
            "refs/remotes/verify/deen/bringup-ack515-base"

          STAGING_SHA="$(git ls-remote origin "refs/heads/import/staging-android14-5.15-lts" | awk 'NR == 1 {print $1}')"
          if [[ -n "$STAGING_SHA" ]]; then
            echo "::error::Temporary staging ref still exists at $STAGING_SHA."
            exit 1
          fi

          git cat-file -e "$EXPECTED_ACK_SHA^{commit}"
          git fsck --full --no-reflogs --no-progress "$EXPECTED_ACK_SHA"

          FIRST_PARENT_COUNT="$(git rev-list --first-parent --count "$EXPECTED_ACK_SHA")"
          TOTAL_REACHABLE_COMMITS="$(git rev-list --count "$EXPECTED_ACK_SHA")"
          REPOSITORY_DISK_SIZE="$(du -sh .git | awk '{print $1}')"
          PACK_SIZE="$(git count-objects -vH | awk '$1 == "size-pack:" {print $2, $3}')"

          {
            echo "## ACK 5.15 LTS import independently verified"
            echo
            echo "- Pinned upstream SHA: $EXPECTED_ACK_SHA"
            echo "- upstream/android14-5.15-lts: exact SHA match"
            echo "- deen/bringup-ack515-base: exact SHA match"
            echo "- Temporary staging ref: absent"
            echo "- First-parent commits: $FIRST_PARENT_COUNT"
            echo "- Reachable commits: $TOTAL_REACHABLE_COMMITS"
            echo "- Git pack size: $PACK_SIZE"
            echo "- Checked-out .git size: $REPOSITORY_DISK_SIZE"
            echo "- git fsck --full: passed"
          } >> "$GITHUB_STEP_SUMMARY"

          cat > "$RUNNER_TEMP/ACK_IMPORT_VERIFICATION.md" <<EOF
          # Android Common Kernel import verification

          - Result: PASS
          - Verified upstream commit: $EXPECTED_ACK_SHA
          - upstream/android14-5.15-lts: exact SHA match
          - deen/bringup-ack515-base: exact SHA match
          - Temporary staging ref: absent
          - First-parent commits: $FIRST_PARENT_COUNT
          - Reachable commits: $TOTAL_REACHABLE_COMMITS
          - Git pack size: $PACK_SIZE
          - Git object-store directory size: $REPOSITORY_DISK_SIZE
          - Integrity check: git fsck --full passed

          This verifies source-history integrity only. It is not a device build or boot test.
          EOF

          COMMITTED=0
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git switch -C main origin/main
            cp "$RUNNER_TEMP/ACK_IMPORT_VERIFICATION.md" documentation/ACK_IMPORT_VERIFICATION.md
            git add documentation/ACK_IMPORT_VERIFICATION.md
            if git diff --cached --quiet; then
              COMMITTED=1
              break
            fi
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "ci: record successful ACK import integrity verification"
            if git push origin HEAD:refs/heads/main; then
              COMMITTED=1
              break
            fi
            echo "main advanced during verification report publication; retrying."
            sleep 3
          done
          test "$COMMITTED" -eq 1
          echo "Independent import verification completed and its report was committed."
