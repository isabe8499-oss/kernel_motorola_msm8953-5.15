name: Deen MSM8953 DTSI validation (experimental)

on:
  push:
    branches:
      - deen/dts-bringup
    paths:
      - "arch/arm64/boot/dts/qcom/msm8953.dtsi"
      - "arch/arm64/boot/dts/qcom/pm8953.dtsi"
      - "arch/arm64/boot/dts/qcom/Makefile"
      - ".github/workflows/deen-msm8953-dtsi-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-soc-dtsi:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout experimental DTS branch
        uses: actions/checkout@v4
        with:
          ref: deen/dts-bringup
          fetch-depth: 1

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu libssl-dev libncurses-dev

      - name: Prepare isolated MSM8953 validation board
        shell: bash
        run: |
          set -euo pipefail
          cd arch/arm64/boot/dts/qcom
          cat > msm8953-validation.dts <<'EOF'
          // SPDX-License-Identifier: GPL-2.0-only
          /dts-v1/;

          #include "msm8953.dtsi"
          #include "pm8953.dtsi"

          / {
            model = "Qualcomm MSM8953 DTSI validation board";
            compatible = "qcom,msm8953";
          };
          EOF

          printf '\ndtb-$(CONFIG_ARCH_QCOM) += msm8953-validation.dtb\n' >> Makefile

      - name: Configure ARM64 and compile the isolated DTB
        shell: bash
        run: |
          set -euo pipefail
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --file .config --enable ARCH_QCOM
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- arch/arm64/boot/dts/qcom/msm8953-validation.dtb

          test -s arch/arm64/boot/dts/qcom/msm8953-validation.dtb
          file arch/arm64/boot/dts/qcom/msm8953-validation.dtb

      - name: Publish validation result
        if: always()
        run: |
          {
            echo "## Experimental MSM8953 DTSI compile"
            echo
            echo "This job tests only whether the imported SoC/PMIC DTSI pair preprocesses and compiles against the ACK 5.15 tree."
            echo "It does not validate the Motorola Deen board description, peripheral bindings, device boot, or hardware operation."
          } >> "$GITHUB_STEP_SUMMARY"
