name: Deen ACK 5.15 full Image and DTB compile smoke

on:
  push:
    branches: ["main"]
    paths:
      - "bootstrap/DEEN_IMAGE_SMOKE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deen-ack515-image-smoke-lld1
  cancel-in-progress: false

jobs:
  build-image:
    name: Link ACK 5.15 Image with MSM8953 support and Deen DTBs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out project control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex libelf-dev libncurses-dev libssl-dev \
            python3 python3-dev dwarves binutils-aarch64-linux-gnu \
            clang-18 lld-18 llvm-18

      - name: Fetch pinned Deen bring-up source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/deen-image-src"
          git fetch --no-tags --depth=1 origin \
            +refs/heads/deen/dts-bringup:refs/remotes/origin/deen/dts-bringup
          git worktree add --detach "$SRC" refs/remotes/origin/deen/dts-bringup
          SOURCE_SHA="$(git -C "$SRC" rev-parse HEAD)"
          echo "Deen source commit: $SOURCE_SHA"
          test -s "$SRC/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dts"
          test -s "$SRC/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dts"
          grep -q "MSM8953_VDDCX" "$SRC/include/dt-bindings/power/qcom-rpmpd.h"
          grep -q "qcom,msm8953-rpmpd" "$SRC/drivers/soc/qcom/rpmpd.c"

      - name: Configure the generic GKI base plus MSM8953 boot dependencies
        id: configure
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/deen-image-src"
          OUT="$RUNNER_TEMP/deen-image-out"
          mkdir -p "$OUT"

          LLVM_BIN="/usr/lib/llvm-18/bin"
          mkdir -p "$RUNNER_TEMP/llvm-bin"
          for TOOL in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            FOUND=""
            for CANDIDATE in "$LLVM_BIN/$TOOL" "/usr/bin/$TOOL-18" "/usr/bin/$TOOL"; do
              if [[ -x "$CANDIDATE" ]]; then FOUND="$CANDIDATE"; break; fi
            done
            if [[ -n "$FOUND" ]]; then ln -sf "$FOUND" "$RUNNER_TEMP/llvm-bin/$TOOL"; fi
          done
          if [[ ! -x "$RUNNER_TEMP/llvm-bin/ld.lld" ]]; then
            sudo apt-get install -y --no-install-recommends lld
            for CANDIDATE in /usr/bin/ld.lld-18 /usr/bin/ld.lld; do
              if [[ -x "$CANDIDATE" ]]; then ln -sf "$CANDIDATE" "$RUNNER_TEMP/llvm-bin/ld.lld"; break; fi
            done
          fi
          test -x "$RUNNER_TEMP/llvm-bin/ld.lld"
          export PATH="$RUNNER_TEMP/llvm-bin:$PATH"

          make -C "$SRC" O="$OUT" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang-18 LD=ld.lld HOSTLD=ld.lld AR=llvm-ar-18 \
            NM=llvm-nm-18 OBJCOPY=llvm-objcopy-18 \
            OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            HOSTCC=clang-18 HOSTCXX=clang++-18 gki_defconfig

          "$SRC/scripts/config" --file "$OUT/.config" \
            --enable ARCH_QCOM \
            --enable COMMON_CLK_QCOM \
            --enable MSM_GCC_8953 \
            --enable PINCTRL_MSM \
            --enable PINCTRL_MSM8953 \
            --enable MAILBOX \
            --enable RPMSG \
            --enable QCOM_SMD_RPM \
            --enable QCOM_RPMPD \
            --enable SPMI \
            --enable SPMI_MSM_PMIC_ARB \
            --enable MFD_SPMI_PMIC \
            --enable REGULATOR_QCOM_SMD_RPM \
            --enable REGULATOR_QCOM_SPMI \
            --enable REGULATOR_FIXED_VOLTAGE \
            --enable MMC \
            --enable MMC_SDHCI \
            --enable MMC_SDHCI_PLTFM \
            --enable MMC_SDHCI_MSM \
            --enable KEYBOARD_GPIO

          make -C "$SRC" O="$OUT" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang-18 LD=ld.lld HOSTLD=ld.lld AR=llvm-ar-18 \
            NM=llvm-nm-18 OBJCOPY=llvm-objcopy-18 \
            OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            HOSTCC=clang-18 HOSTCXX=clang++-18 olddefconfig

          for SYMBOL in LTO_CLANG_FULL CFI_CLANG; do
            grep -qx "CONFIG_${SYMBOL}=y" "$OUT/.config" || {
              echo "::error::GKI Full LTO/CFI config did not retain CONFIG_${SYMBOL}=y"
              exit 1
            }
          done

          for SYMBOL in \
            ARCH_QCOM COMMON_CLK_QCOM MSM_GCC_8953 PINCTRL_MSM PINCTRL_MSM8953 \
            MAILBOX RPMSG QCOM_SMD_RPM QCOM_RPMPD \
            SPMI SPMI_MSM_PMIC_ARB MFD_SPMI_PMIC \
            REGULATOR_QCOM_SMD_RPM REGULATOR_QCOM_SPMI REGULATOR_FIXED_VOLTAGE \
            MMC MMC_SDHCI MMC_SDHCI_PLTFM MMC_SDHCI_MSM KEYBOARD_GPIO; do
            grep -qx "CONFIG_${SYMBOL}=y" "$OUT/.config" || {
              echo "::error::Kconfig did not retain CONFIG_${SYMBOL}=y"
              exit 1
            }
          done

          cp "$OUT/.config" "$RUNNER_TEMP/DEEN_GKI_CONFIG"
          sha256sum "$OUT/.config" > "$RUNNER_TEMP/DEEN_GKI_CONFIG.sha256"
          echo "source_sha=$(git -C "$SRC" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "config_sha=$(sha256sum "$OUT/.config" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "clang_version=$(clang-18 --version | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "Disk after configuration:"
          df -h .

      - name: Prepare bounded swap for GKI Full LTO
        shell: bash
        run: |
          set -euo pipefail
          if swapon --show --noheadings | grep -q .; then
            echo "Existing swap detected; preserving runner configuration."
          else
            AVAILABLE_KB="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
            if (( AVAILABLE_KB >= 10 * 1024 * 1024 )); then
              SWAP_GIB=4
            elif (( AVAILABLE_KB >= 8 * 1024 * 1024 )); then
              SWAP_GIB=2
            else
              SWAP_GIB=0
            fi

            if (( SWAP_GIB > 0 )); then
              echo "Creating ${SWAP_GIB} GiB swap; retaining at least 6 GiB for build files."
              sudo fallocate -l "${SWAP_GIB}G" /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            else
              echo "Insufficient disk headroom for extra swap; keeping filesystem space for kernel objects."
            fi
          fi

          echo "Memory and swap before Full LTO:"
          free -h
          swapon --show
          echo "Available filesystem space:"
          df -h "$RUNNER_TEMP"

      - name: Serialize LLD link-time work without changing Full LTO or CFI
        shell: bash
        run: |
          set -euo pipefail
          LINKER_PATH="$RUNNER_TEMP/llvm-bin/ld.lld"
          if [[ -L "$LINKER_PATH" ]]; then
            LINKER_TARGET="$(readlink "$LINKER_PATH")"
            if [[ "$LINKER_TARGET" != /* ]]; then
              LINKER_TARGET="$(realpath -s "$(dirname "$LINKER_PATH")/$LINKER_TARGET")"
            fi
          else
            LINKER_TARGET="$LINKER_PATH"
          fi

          # Keep the executable alias named ld.lld. Resolving the symlink with
          # readlink -f changes argv[0] to "lld-18", which selects the generic
          # driver instead of the ELF linker.
          REAL_LINKER_DIR="$RUNNER_TEMP/real-llvm-linker"
          mkdir -p "$REAL_LINKER_DIR"
          REAL_LINKER="$REAL_LINKER_DIR/ld.lld"
          ln -sf "$LINKER_TARGET" "$REAL_LINKER"
          test -x "$REAL_LINKER"

          LLD_HELP="$("$REAL_LINKER" --help)"
          grep -q -- '--threads' <<< "$LLD_HELP"
          "$REAL_LINKER" --threads=1 --version

          rm -f "$LINKER_PATH"
          printf '#!/usr/bin/env bash\nexec "%s" --threads=1 "$@"\n' "$REAL_LINKER" > "$LINKER_PATH"
          chmod 755 "$LINKER_PATH"

          # Prove the wrapper performs a real ELF link before the expensive kernel LTO.
          printf '.globl _start\n_start:\n  ret\n' > "$RUNNER_TEMP/lld-smoke.s"
          clang-18 -c "$RUNNER_TEMP/lld-smoke.s" -o "$RUNNER_TEMP/lld-smoke.o"
          "$LINKER_PATH" -e _start -o "$RUNNER_TEMP/lld-smoke" "$RUNNER_TEMP/lld-smoke.o"
          test -s "$RUNNER_TEMP/lld-smoke"

          echo "LLD wrapper and smoke ELF:"
          "$LINKER_PATH" --version
          file "$RUNNER_TEMP/lld-smoke"
          sha256sum "$REAL_LINKER" "$LINKER_PATH" "$RUNNER_TEMP/lld-smoke"

      - name: Build complete Image and both Deen DTB candidates
        id: build
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/deen-image-src"
          OUT="$RUNNER_TEMP/deen-image-out"
          export PATH="$RUNNER_TEMP/llvm-bin:$PATH"

          MEMORY_LOG="$RUNNER_TEMP/deen-full-lto-memory.log"
          : > "$MEMORY_LOG"

          (
            while :; do
              {
                echo "===== Full LTO memory telemetry $(date -u +%FT%TZ) ====="
                free -h
                ps -eo pid,ppid,rss,vsz,%mem,comm --sort=-rss | head -n 12
                if [[ -r /proc/pressure/memory ]]; then
                  echo "--- memory PSI ---"
                  cat /proc/pressure/memory
                fi
                if [[ -r /sys/fs/cgroup/memory.events ]]; then
                  echo "--- cgroup memory.events ---"
                  cat /sys/fs/cgroup/memory.events
                fi
                if [[ -r /proc/vmstat ]]; then
                  echo "--- swap and OOM counters ---"
                  awk '/^(pswpin|pswpout|oom_kill|pgmajfault) / {print}' /proc/vmstat
                fi
                df -h "$RUNNER_TEMP"
              } | tee -a "$MEMORY_LOG"
              sleep 30
            done
          ) &
          MEMORY_MONITOR_PID=$!

          set +e
          BUILD_START_EPOCH="$(date +%s)"
          make -C "$SRC" O="$OUT" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang-18 LD=ld.lld HOSTLD=ld.lld AR=llvm-ar-18 \
            NM=llvm-nm-18 OBJCOPY=llvm-objcopy-18 \
            OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            HOSTCC=clang-18 HOSTCXX=clang++-18 -j1 \
            Image \
            qcom/msm8953-motorola-deen-pvt1.dtb \
            qcom/msm8953-motorola-deen-pvt2.dtb \
            2>&1 | tee "$RUNNER_TEMP/deen-image-build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          # Snapshot immediately: if the runner sends SIGTERM, this step may not
          # reach its post-build section. These logs are emitted by the runner UI.
          kill "$MEMORY_MONITOR_PID" 2>/dev/null || true
          wait "$MEMORY_MONITOR_PID" 2>/dev/null || true
          BUILD_END_EPOCH="$(date +%s)"
          echo "Build elapsed seconds: $((BUILD_END_EPOCH - BUILD_START_EPOCH))"
          echo "Build command exit status: $BUILD_STATUS"
          echo "===== immediate post-build memory snapshot $(date -u +%FT%TZ) ====="
          free -h
          swapon --show
          cat /proc/pressure/memory 2>/dev/null || true
          if [[ -r /sys/fs/cgroup/memory.events ]]; then cat /sys/fs/cgroup/memory.events; fi
          if [[ -r /proc/vmstat ]]; then
            awk '/^(pswpin|pswpout|oom_kill|pgmajfault) / {print}' /proc/vmstat
          fi
          df -h "$RUNNER_TEMP"

          {
            echo "===== post-build diagnostics $(date -u +%FT%TZ) ====="
            if [[ -r /sys/fs/cgroup/memory.events ]]; then cat /sys/fs/cgroup/memory.events; fi
            if command -v dmesg >/dev/null 2>&1; then
              sudo dmesg --ctime 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process' | tail -n 80 || true
            fi
          } | tee -a "$RUNNER_TEMP/deen-full-lto-memory.log"

          IMAGE="$OUT/arch/arm64/boot/Image"
          PVT1="$OUT/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dtb"
          PVT2="$OUT/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dtb"
          IMAGE_SHA="not-built"
          PVT1_SHA="not-built"
          PVT2_SHA="not-built"
          RESULT="FAIL"

          if [[ "$BUILD_STATUS" -eq 0 && -s "$IMAGE" && -s "$PVT1" && -s "$PVT2" ]]; then
            IMAGE_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
            PVT1_SHA="$(sha256sum "$PVT1" | awk '{print $1}')"
            PVT2_SHA="$(sha256sum "$PVT2" | awk '{print $1}')"
            RESULT="PASS"
          else
            BUILD_STATUS=1
          fi

          {
            echo "# Deen ACK 5.15 full Image compile smoke"
            echo
            echo "- Result: $RESULT"
            echo "- Source branch: deen/dts-bringup"
            echo "- Source commit: ${{ steps.configure.outputs.source_sha }}"
            echo "- Base config: generic GKI defconfig plus MSM8953 platform/PMIC/eMMC options"
            echo "- Resolved config SHA-256: ${{ steps.configure.outputs.config_sha }}"
            echo "- Compiler: ${{ steps.configure.outputs.clang_version }}"
            echo "- LTO/CFI: GKI Full LTO and Clang CFI retained"
            echo "- CI memory mitigation: bounded swap based on free disk, serial build (-j1), LLD link threads=1, persistent RAM/swap/PSI/cgroup telemetry"
            echo "- Build target: full arm64 Image plus PVT1 and PVT2 DTBs"
            echo "- PVT1 board ID: 0x4D 0xC100"
            echo "- PVT2 board ID: 0x4D 0xC200"
            echo "- Image SHA-256: $IMAGE_SHA"
            echo "- PVT1 DTB SHA-256: $PVT1_SHA"
            echo "- PVT2 DTB SHA-256: $PVT2_SHA"
            echo
            echo "This is a full kernel link smoke using generic GKI configuration. It is not a Deen-specific defconfig, boot.img, vendor_boot/DTBO integration, hardware boot test or permission to flash."
          } > "$RUNNER_TEMP/DEEN_IMAGE_SMOKE.md"

          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            {
              echo
              echo "## Last build log lines"
              if [[ -s "$RUNNER_TEMP/deen-image-build.log" ]]; then tail -n 120 "$RUNNER_TEMP/deen-image-build.log"; fi
            } >> "$RUNNER_TEMP/DEEN_IMAGE_SMOKE.md"
          fi
          cat "$RUNNER_TEMP/DEEN_IMAGE_SMOKE.md" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$BUILD_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload Image, DTBs, config and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deen-ack515-full-image-smoke
          path: |
            ${{ runner.temp }}/DEEN_IMAGE_SMOKE.md
            ${{ runner.temp }}/deen-image-build.log
            ${{ runner.temp }}/deen-full-lto-memory.log
            ${{ runner.temp }}/DEEN_GKI_CONFIG
            ${{ runner.temp }}/DEEN_GKI_CONFIG.sha256
            ${{ runner.temp }}/deen-image-out/.config
            ${{ runner.temp }}/deen-image-out/arch/arm64/boot/Image
            ${{ runner.temp }}/deen-image-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dtb
            ${{ runner.temp }}/deen-image-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dtb
          if-no-files-found: warn
          retention-days: 14

      - name: Publish full Image smoke report to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$RUNNER_TEMP/DEEN_IMAGE_SMOKE.md" ]]; then
            {
              echo "# Deen ACK 5.15 full Image compile smoke"
              echo
              echo "- Result: FAIL / INCOMPLETE"
              echo "- Build did not reach the report stage. Inspect the earlier job step for the first failure."
              if [[ -s "$RUNNER_TEMP/deen-image-build.log" ]]; then tail -n 100 "$RUNNER_TEMP/deen-image-build.log"; fi
            } > "$RUNNER_TEMP/DEEN_IMAGE_SMOKE.md"
          fi
          COMMITTED=0
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git switch -C main origin/main
            cp "$RUNNER_TEMP/DEEN_IMAGE_SMOKE.md" documentation/DEEN_IMAGE_SMOKE.md
            git add documentation/DEEN_IMAGE_SMOKE.md
            if git diff --cached --quiet; then COMMITTED=1; break; fi
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "ci: record Deen full Image compile smoke result"
            if git push origin HEAD:refs/heads/main; then COMMITTED=1; break; fi
            sleep 3
          done
          test "$COMMITTED" -eq 1

      - name: Fail workflow if full Image build did not pass
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: exit 1
