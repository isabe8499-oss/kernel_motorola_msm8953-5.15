name: ACK 5.15 SMSM local-host bounds guard (ARM64 host only)

on:
  push:
    branches:
      - fix/ack515-qcom-smsm-local-host-bounds-20261119
  pull_request:
    branches:
      - deen/c100-schema-reconcile-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smsm-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout ACK-derived source
        uses: actions/checkout@v4

      - name: Install LLVM18 dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex make python3 libssl-dev libelf-dev \
            clang-18 llvm-18 lld-18 gcc-aarch64-linux-gnu
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Run six negative and source-order tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deen-smsm-guard"
          git rev-parse HEAD | tee "$RUNNER_TEMP/deen-smsm-guard/head-sha.txt"
          python3 -m unittest discover -s scripts \
            -p 'test_qcom_smsm_local_host_bounds.py' -v \
            2>&1 | tee "$RUNNER_TEMP/deen-smsm-guard/tests.log"

      - name: Compile actual ARM64 smsm.o, do not enable firmware or run Image
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          OUT="$RUNNER_TEMP/deen-smsm-guard-out"
          LOG="$RUNNER_TEMP/deen-smsm-guard"
          mkdir -p "$OUT"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig \
            2>&1 | tee "$LOG/gki-defconfig.log"
          scripts/config --file "$OUT/.config" \
            -e QCOM_SMEM -e QCOM_SMSM -d QCOM_APCS_IPC
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$LOG/olddefconfig.log"
          grep -Fxq 'CONFIG_QCOM_SMEM=y' "$OUT/.config"
          grep -Fxq 'CONFIG_QCOM_SMSM=y' "$OUT/.config"
          if grep -Fxq 'CONFIG_QCOM_APCS_IPC=y' "$OUT/.config"; then
            echo "FAIL_UNEXPECTED_APCS_ENABLEMENT"; exit 3
          fi
          cp "$OUT/.config" "$LOG/smsm-build.config"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j2 \
            drivers/soc/qcom/smsm.o \
            2>&1 | tee "$LOG/smsm-build.log"
          test -s "$OUT/drivers/soc/qcom/smsm.o"
          file "$OUT/drivers/soc/qcom/smsm.o" | tee "$LOG/smsm-object-type.txt"
          grep -Eiq 'LLVM.*bitcode|ELF.*(aarch64|ARM64)' "$LOG/smsm-object-type.txt"
          sha256sum "$OUT/drivers/soc/qcom/smsm.o" > "$LOG/smsm-object.sha256"
          echo "PASS_ARM64_SMSM_GUARD_OBJECT_ONLY_RUNTIME_HOLD" | tee "$LOG/gate.txt"

      - name: Publish evidence only, no kernel Image or proprietary FDT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ack515-smsm-local-host-guard-host-logs
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/deen-smsm-guard/*.log
            ${{ runner.temp }}/deen-smsm-guard/*.txt
            ${{ runner.temp }}/deen-smsm-guard/*.config
            ${{ runner.temp }}/deen-smsm-guard/*.sha256
