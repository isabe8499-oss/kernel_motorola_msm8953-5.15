name: Deen ACK 5.15 SMSM guards + TSENS quarantine full link - host only

on:
  push:
    branches: [ci/deen-ack515-smsm-guards-tsens-quarantine-20261120]
  pull_request:
    branches: [ci/deen-ack515-smsm-bounds-full-link-20261119]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned LLVM18 and full-build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex make python3 clang-18 llvm-18 lld-18 \
            libssl-dev libelf-dev dwarves rsync cpio zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Verify integrated SMSM shared-memory guard and prior bounds patch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ack-full-log"
          python3 -m unittest discover -s scripts \
            -p 'test_qcom_smsm_local_host_bounds.py' -v \
            2>&1 | tee "$RUNNER_TEMP/ack-full-log/smsm-host-index-tests.log"
          python3 -m unittest discover -s scripts \
            -p 'test_qcom_smsm_shared_item_bounds.py' -v \
            2>&1 | tee "$RUNNER_TEMP/ack-full-log/smsm-item-size-tests.log"
          python3 -m unittest discover -s scripts \
            -p 'test_deen_tsens_type3_quarantine_gate.py' -v \
            2>&1 | tee "$RUNNER_TEMP/ack-full-log/tsens-quarantine-tests.log"
      - name: Resolve GKI Deen20 and restricted SMEM/RPM host5 Kconfig
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          OUT="$RUNNER_TEMP/ack-full-out"
          LOG="$RUNNER_TEMP/ack-full-log"
          mkdir -p "$OUT" "$LOG"
          git rev-parse HEAD | tee "$LOG/head-sha.txt"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig \
            2>&1 | tee "$LOG/gki.log"
          cp "$OUT/.config" "$LOG/gki.config"
          KCONFIG_CONFIG="$OUT/.config" scripts/kconfig/merge_config.sh -m \
            -O "$OUT" "$OUT/.config" \
            arch/arm64/configs/deen-msm8953-base.fragment \
            2>&1 | tee "$LOG/merge-deen20.log"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$LOG/old-deen20.log"
          cp "$OUT/.config" "$LOG/deen20.config"
          KCONFIG_CONFIG="$OUT/.config" scripts/kconfig/merge_config.sh -m \
            -O "$OUT" "$OUT/.config" \
            arch/arm64/configs/deen-msm8953-smem-rpm-host.fragment \
            2>&1 | tee "$LOG/merge-host5.log"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$LOG/old-host5.log"
          cp "$OUT/.config" "$LOG/host5.config"
          python3 scripts/deen_gki_smem_rpm_config_gate.py \
            --gki-config "$LOG/gki.config" \
            --minimal-config "$LOG/deen20.config" \
            --host-config "$LOG/host5.config" \
            --base-fragment arch/arm64/configs/deen-msm8953-base.fragment \
            --host-fragment arch/arm64/configs/deen-msm8953-smem-rpm-host.fragment \
            --output "$LOG/config-contract.json" \
            2>&1 | tee "$LOG/config-contract.log"
          grep -Fxq 'CONFIG_LTO_CLANG_FULL=y' "$OUT/.config"
          grep -Fxq 'CONFIG_CFI_CLANG=y' "$OUT/.config"
          for opt in QCOM_Q6V5_MSS QCOM_Q6V5_PAS QCOM_WCNSS_PIL \
                     QCOM_SMP2P QCOM_SMSM QCOM_TSENS; do
            if grep -Fxq "CONFIG_$opt=y" "$OUT/.config"; then
              echo "FORBIDDEN_ENABLEMENT: $opt"; exit 3
            fi
          done
          # On this CI-only host6 stage enable SMSM but NOT APCS mailbox
          # nor remoteproc/SMP2P/TSENS. Run before ThinLTO switch.
          KCONFIG_CONFIG="$OUT/.config" scripts/kconfig/merge_config.sh -m \
            -O "$OUT" "$OUT/.config" \
            arch/arm64/configs/deen-msm8953-smsm-only-host.fragment \
            2>&1 | tee "$LOG/merge-smsm-only.log"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$LOG/old-smsm-only.log"
          cp "$OUT/.config" "$LOG/smsm-host6.config"
          python3 - "$LOG/host5.config" "$LOG/smsm-host6.config" "$LOG/smsm-scope.json" <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,"scripts")
          from deen_c100_smsm_only_host_gate import config_gate
          result=config_gate(pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2]),
              pathlib.Path("arch/arm64/configs/deen-msm8953-smsm-only-host.fragment"))
          assert not result["errors"], result
          assert result["delta"] == {"QCOM_SMSM":["n","y"]}, result
          pathlib.Path(sys.argv[3]).write_text(json.dumps(result,indent=2)+"\n")
          print("PASS_ONE_SYMBOL_SMSM_ONLY_CONFIG")
          PY
          grep -Fxq 'CONFIG_QCOM_SMSM=y' "$OUT/.config"
          if grep -Fxq 'CONFIG_QCOM_APCS_IPC=y' "$OUT/.config"; then
            echo "FAIL_APCS_MAILBOX_ENABLED"; exit 3
          fi
          # This is a host-only compare against the original FULL LTO
          # gki+Deen20+host5 config. ThinLTO keeps CFI, is NOT original GKI.
          # Never alter tracked kernel configuration or runtime firmware.
          scripts/config --file "$OUT/.config" \
            -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$LOG/old-thinlto-cfi.log"
          cp "$OUT/.config" "$LOG/thinlto-cfi.config"
          grep -Fxq 'CONFIG_LTO_CLANG_THIN=y' "$OUT/.config"
          grep -Fxq 'CONFIG_CFI_CLANG=y' "$OUT/.config"
          grep -Fxq 'CONFIG_LTO_CLANG=y' "$OUT/.config"
          grep -Fxq 'CONFIG_LTO=y' "$OUT/.config"
          if grep -Eq '^CONFIG_(LTO_CLANG_FULL|LTO_NONE)=y$' "$OUT/.config"; then
            echo "FAIL_THINLTO_CONFLICT"; exit 3
          fi
          python3 - "$LOG/smsm-host6.config" "$OUT/.config" "$LOG/thinlto-cfi-delta.json" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "scripts")
          from deen_gki_smem_rpm_config_gate import read_config, MINIMAL, HOST_ONLY, NO_NEW_ENABLEMENT
          before = read_config(pathlib.Path(sys.argv[1]))
          after = read_config(pathlib.Path(sys.argv[2]))
          for key in MINIMAL + HOST_ONLY:
              assert before.get(key) == after.get(key) == "y", key
          for key in ("CFI_CLANG", "LTO_CLANG"):
              assert before.get(key) == after.get(key) == "y", key
          assert before.get("LTO_CLANG_FULL") == "y"
          assert after.get("LTO_CLANG_FULL", "n") == "n"
          assert after.get("LTO_CLANG_THIN") == "y"
          assert before.get("QCOM_SMSM") == after.get("QCOM_SMSM") == "y"
          assert before.get("QCOM_APCS_IPC","n") == after.get("QCOM_APCS_IPC","n") == "n"
          for key in NO_NEW_ENABLEMENT:
              assert not (before.get(key, "n") not in ("y","m") and after.get(key, "n") in ("y","m")), key
          delta = {k: [before.get(k,"n"),after.get(k,"n")]
                   for k in sorted(set(before)|set(after))
                   if before.get(k,"n")!=after.get(k,"n")}
          assert delta == {"LTO_CLANG_FULL":["y","n"],"LTO_CLANG_THIN":["n","y"]}, delta
          pathlib.Path(sys.argv[3]).write_text(json.dumps({
              "gate":"HOST_THINLTO_CFI_SCOPE_ONLY",
              "original_gki_full_lto_validated":False,
              "cfi_kept":True,
              "firmware_remoteproc_thermal_runtime":"HOLD",
              "delta":delta
          },indent=2)+"\n")
          print("PASS_THINLTO_CFI_CONFIG_SCOPE", delta)
          PY
      - name: Build and link full ARM64 Image with ThinLTO and CFI, NO FLASH
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          OUT="$RUNNER_TEMP/ack-full-out"
          LOG="$RUNNER_TEMP/ack-full-log"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j2 Image \
            2>&1 | tee "$LOG/full-image-build.log"
          test -s "$OUT/vmlinux"
          test -s "$OUT/arch/arm64/boot/Image"
          llvm-readelf -h "$OUT/vmlinux" > "$LOG/vmlinux-elf.txt"
          grep -Fq 'AArch64' "$LOG/vmlinux-elf.txt"
          sha256sum "$OUT/vmlinux" "$OUT/arch/arm64/boot/Image" \
            > "$LOG/full-image-sha256.txt"
          wc -c "$OUT/vmlinux" "$OUT/arch/arm64/boot/Image" \
            > "$LOG/full-image-sizes.txt"
          test -s "$OUT/drivers/soc/qcom/smsm.o"
          file "$OUT/drivers/soc/qcom/smsm.o" | tee "$LOG/smsm-object-file.txt"
          sha256sum "$OUT/drivers/soc/qcom/smsm.o" > "$LOG/smsm-object-sha256.txt"
          echo "PASS_THINLTO_CFI_SMSM_BOUNDS_TSENS_QUARANTINE_FULL_LINK_RUNTIME_HOLD" | tee "$LOG/full-image-gate.txt"
      - name: Verify the quarantined Deen PVT DTBs (NO thermal enablement)
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          OUT="$RUNNER_TEMP/ack-full-out"
          LOG="$RUNNER_TEMP/ack-full-log"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j2 \
            qcom/msm8953-motorola-deen-pvt1.dtb \
            qcom/msm8953-motorola-deen-pvt2.dtb \
            2>&1 | tee "$LOG/dtb-build.log"
          DT="$OUT/arch/arm64/boot/dts/qcom"
          sha256sum "$DT"/msm8953-motorola-deen-pvt{1,2}.dtb \
            | tee "$LOG/dtb-quarantine-hashes.txt"
          python3 scripts/deen_tsens_type3_quarantine_gate.py \
            --pvt1 "$DT/msm8953-motorola-deen-pvt1.dtb" \
            --pvt2 "$DT/msm8953-motorola-deen-pvt2.dtb" \
            --output "$LOG/quarantine-gate.json" \
            2>&1 | tee "$LOG/quarantine-gate.log"
          python3 - "$LOG/quarantine-gate.json" "$DT" <<'PY'
          import hashlib,json,pathlib,sys
          gate=json.load(open(sys.argv[1]))
          assert gate["result"] == "PASS_QUARANTINE_ONLY_RUNTIME_HOLD"
          assert gate["safe_for_flash"] is False
          assert gate["stock_type3_register_equivalence"] == "HOLD"
          assert gate["tsens_runtime_and_thermal_protection"] == "HOLD"
          assert gate["full_kernel_boot_and_flash"] == "HOLD"
          expected_previous={
              "pvt1":"fa9ca9966da457ee45b28fc3e2479ed145bc5cfb20e537faff45ca472b510d1a",
              "pvt2":"9d3291f5ee86799032efdf4c6bec0b5950a35170bcd88cc77bc1820fb08c2b05",
          }
          for board, old in expected_previous.items():
              actual = gate["checks"][board]["observed"]
              assert actual["status"] == ["disabled"]
              assert actual["sensor_count"] == [16]
              assert actual["board_id"] == ([0x4d,0xc100] if board=="pvt1" else [0x4d,0xc200])
              file=pathlib.Path(sys.argv[2])/("msm8953-motorola-deen-"+board+".dtb")
              digest=hashlib.sha256(file.read_bytes()).hexdigest()
              assert digest != old, "quarantine must change the old DTB hash"
          print("PASS_SMSM_BOUNDS_AND_TSENS_QUARANTINE_LINK_ONLY_RUNTIME_HOLD")
          PY
      - name: Publish logs and SHA only, never Image, vmlinux or stock boot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deen-ack515-smsm-bounds-tsens-quarantine-full-link-logs
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ack-full-log/*.log
            ${{ runner.temp }}/ack-full-log/*.json
            ${{ runner.temp }}/ack-full-log/*.config
            ${{ runner.temp }}/ack-full-log/*.txt
