name: Deen MSM8953 base DTS compile smoke

on:
  push:
    branches: ["main"]
    paths:
      - "bootstrap/DEEN_DTS_BASE_SMOKE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deen-msm8953-base-dts-smoke
  cancel-in-progress: false

jobs:
  dts-base-smoke:
    name: Compile MSM8953 and PM8953 DTSI base
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out project control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Install device-tree build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex libelf-dev libncurses-dev libssl-dev \
            python3 python3-dev python3-venv swig libfdt-dev dwarves binutils-aarch64-linux-gnu \
            clang-18 lld-18 llvm-18

      - name: Install devicetree schema validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dtschema-venv"
          "$RUNNER_TEMP/dtschema-venv/bin/pip" install --upgrade pip dtschema
          echo "$RUNNER_TEMP/dtschema-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch clean Deen DTS bring-up branch
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/deen-src"
          git fetch --no-tags --depth=1 origin \
            +refs/heads/deen/dts-bringup:refs/remotes/origin/deen/dts-bringup
          git worktree add --detach "$SRC" refs/remotes/origin/deen/dts-bringup
          git -C "$SRC" rev-parse HEAD

      - name: Compile a generated MSM8953 and PM8953 base-only DTS fixture
        id: dts-smoke
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/deen-src"
          OUT="$RUNNER_TEMP/deen-out"
          mkdir -p "$OUT"
          make -C "$SRC" O="$OUT" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang-18 LD=ld.lld-18 AR=llvm-ar-18 \
            NM=llvm-nm-18 OBJCOPY=llvm-objcopy-18 \
            OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            HOSTCC=clang-18 HOSTCXX=clang++-18 gki_defconfig

          "$SRC/scripts/config" --file "$OUT/.config" --enable ARCH_QCOM
          make -C "$SRC" O="$OUT" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang-18 LD=ld.lld-18 AR=llvm-ar-18 \
            NM=llvm-nm-18 OBJCOPY=llvm-objcopy-18 \
            OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            HOSTCC=clang-18 HOSTCXX=clang++-18 olddefconfig
          grep -qx "CONFIG_ARCH_QCOM=y" "$OUT/.config"

          cat > "$SRC/arch/arm64/boot/dts/qcom/msm8953-deen-base-smoke.dts" <<'EOF'
          /dts-v1/;

          #include "msm8953.dtsi"
          #include "pm8953.dtsi"

          / {
              model = "MSM8953 Deen base DTS syntax smoke (not for device use)";
              compatible = "qcom,msm8953";
          };
          EOF

          printf '\n# Runtime-generated CI-only DTS syntax fixture; not a device DTB.\ndtb-$(CONFIG_ARCH_QCOM) += msm8953-deen-base-smoke.dtb\n' \
            >> "$SRC/arch/arm64/boot/dts/qcom/Makefile"

          set +e
          make -C "$SRC" O="$OUT" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang-18 LD=ld.lld-18 AR=llvm-ar-18 \
            NM=llvm-nm-18 OBJCOPY=llvm-objcopy-18 \
            OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            HOSTCC=clang-18 HOSTCXX=clang++-18 \
            qcom/msm8953-deen-base-smoke.dtb \
            qcom/msm8953-motorola-deen-pvt1.dtb \
            qcom/msm8953-motorola-deen-pvt2.dtb 2>&1 | tee "$RUNNER_TEMP/dts-build.log"
          DTS_STATUS=${PIPESTATUS[0]}
          set -e

          BASE_DTB="$OUT/arch/arm64/boot/dts/qcom/msm8953-deen-base-smoke.dtb"
          PVT1_DTB="$OUT/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dtb"
          PVT2_DTB="$OUT/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dtb"

          set +e
          dt-doc-validate "$SRC/Documentation/devicetree/bindings/arm/qcom.yaml" \
            2>&1 | tee "$RUNNER_TEMP/dt-binding-check.log"
          BINDING_STATUS=${PIPESTATUS[0]}

          if [[ "$DTS_STATUS" -eq 0 && -s "$BASE_DTB" && -s "$PVT1_DTB" && -s "$PVT2_DTB" ]]; then
            dt-validate -s "$SRC/Documentation/devicetree/bindings/arm/qcom.yaml" \
              "$BASE_DTB" "$PVT1_DTB" "$PVT2_DTB" \
              2>&1 | tee "$RUNNER_TEMP/dtbs-check.log"
            DTBS_STATUS=${PIPESTATUS[0]}
          else
            echo "Skipping targeted DTB schema validation because one or more DTBs failed to compile." \
              | tee "$RUNNER_TEMP/dtbs-check.log"
            DTBS_STATUS=1
          fi
          set -e

          BASE_DTB="$OUT/arch/arm64/boot/dts/qcom/msm8953-deen-base-smoke.dtb"
          PVT1_DTB="$OUT/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dtb"
          PVT2_DTB="$OUT/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dtb"
          BASE_SHA="not-built"
          PVT1_SHA="not-built"
          PVT2_SHA="not-built"
          if [[ "$DTS_STATUS" -eq 0 && -s "$BASE_DTB" && -s "$PVT1_DTB" && -s "$PVT2_DTB" ]]; then
            BASE_SHA="$(sha256sum "$BASE_DTB" | awk '{print $1}')"
            PVT1_SHA="$(sha256sum "$PVT1_DTB" | awk '{print $1}')"
            PVT2_SHA="$(sha256sum "$PVT2_DTB" | awk '{print $1}')"
          else
            DTS_STATUS=1
          fi
          if [[ "$BINDING_STATUS" -ne 0 || "$DTBS_STATUS" -ne 0 ]]; then
            DTS_STATUS=1
          fi

          BRANCH_SHA="$(git -C "$SRC" rev-parse HEAD)"
          CLANG_VERSION="$(clang-18 --version | head -n 1)"
          RESULT="PASS"
          if [[ "$DTS_STATUS" -ne 0 ]]; then RESULT="FAIL"; fi

          {
            echo "# Deen MSM8953/PM8953 base DTS compile smoke"
            echo
            echo "- Result: $RESULT"
            echo "- Branch: deen/dts-bringup"
            echo "- Branch commit: $BRANCH_SHA"
            echo "- SoC DTSI source: Linux v6.1, blob 6b992a6d56c16d5151785df04fa2053c67ee7fad"
            echo "- PMIC DTSI source: Linux v6.1, blob a1d36f9ebbd259e41a80e3af516d9a044419afe0"
            echo "- ACK base: Android Common Kernel 5.15 LTS"
            echo "- Compiler: $CLANG_VERSION"
            echo "- Test: generated base fixture plus Deen PVT1/PVT2 DTBs"
            echo "- qcom.yaml dt_binding_check exit: $BINDING_STATUS"
            echo "- qcom.yaml dtbs_check exit: $DTBS_STATUS"
            echo "- Base-only fixture DTB SHA-256: $BASE_SHA"
            echo "- Deen PVT1 DTB SHA-256 (board ID 0x4D 0xC100): $PVT1_SHA"
            echo "- Deen PVT2 DTB SHA-256 (board ID 0x4D 0xC200): $PVT2_SHA"
            echo
            echo "This is only a base-DTS syntax/include smoke test. It has no Deen PVT board ID or peripheral enablement and is not a flashable device tree."
          } > "$RUNNER_TEMP/DEEN_DTS_BASE_SMOKE.md"

          if [[ "$DTS_STATUS" -ne 0 ]]; then
            {
              echo
              echo "## Last DTS compile log lines"
              if [[ -s "$RUNNER_TEMP/dts-build.log" ]]; then tail -n 70 "$RUNNER_TEMP/dts-build.log"; fi
              echo
              echo "## Last dt_binding_check log lines"
              if [[ -s "$RUNNER_TEMP/dt-binding-check.log" ]]; then tail -n 70 "$RUNNER_TEMP/dt-binding-check.log"; fi
              echo
              echo "## Last dtbs_check log lines"
              if [[ -s "$RUNNER_TEMP/dtbs-check.log" ]]; then tail -n 70 "$RUNNER_TEMP/dtbs-check.log"; fi
            } >> "$RUNNER_TEMP/DEEN_DTS_BASE_SMOKE.md"
          fi

          cat "$RUNNER_TEMP/DEEN_DTS_BASE_SMOKE.md" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$DTS_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload DTS smoke log and generated DTB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deen-msm8953-base-dts-smoke
          path: |
            ${{ runner.temp }}/DEEN_DTS_BASE_SMOKE.md
            ${{ runner.temp }}/dts-build.log
            ${{ runner.temp }}/dt-binding-check.log
            ${{ runner.temp }}/dtbs-check.log
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-deen-base-smoke.dtb
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt1.dtb
            ${{ runner.temp }}/deen-out/arch/arm64/boot/dts/qcom/msm8953-motorola-deen-pvt2.dtb
            ${{ runner.temp }}/deen-out/.config
          if-no-files-found: warn

      - name: Publish DTS smoke report to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$RUNNER_TEMP/DEEN_DTS_BASE_SMOKE.md" ]]; then
            {
              echo "# Deen MSM8953/PM8953 base DTS compile smoke"
              echo
              echo "- Result: FAIL / INCOMPLETE"
              echo "- Branch: deen/dts-bringup"
              echo "- The workflow did not reach the DTS report stage. Inspect this run's earlier steps for the first failure."
              if [[ -s "$RUNNER_TEMP/dts-build.log" ]]; then
                echo
                echo "## Last build log lines"
                tail -n 100 "$RUNNER_TEMP/dts-build.log"
              fi
            } > "$RUNNER_TEMP/DEEN_DTS_BASE_SMOKE.md"
          fi
          COMMITTED=0
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git switch -C main origin/main
            cp "$RUNNER_TEMP/DEEN_DTS_BASE_SMOKE.md" documentation/DEEN_DTS_BASE_SMOKE.md
            git add documentation/DEEN_DTS_BASE_SMOKE.md
            if git diff --cached --quiet; then
              COMMITTED=1
              break
            fi
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "ci: record Deen MSM8953 base DTS smoke result"
            if git push origin HEAD:refs/heads/main; then
              COMMITTED=1
              break
            fi
            echo "main advanced during report publication; retrying."
            sleep 3
          done
          test "$COMMITTED" -eq 1

      - name: Fail workflow if the DTS compile did not pass
        if: steps.dts-smoke.outputs.exit_code != '0'
        shell: bash
        run: exit 1
