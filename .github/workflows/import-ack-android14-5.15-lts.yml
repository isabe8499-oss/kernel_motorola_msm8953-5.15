name: Import full Android Common Kernel 14-5.15 LTS history

on:
  push:
    branches: ["main"]
    paths:
      - "bootstrap/IMPORT_ACK"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-ack-android14-5.15-lts
  cancel-in-progress: false

jobs:
  import:
    name: Fetch and incrementally publish full upstream Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and verify the immutable official ACK revision
        id: source
        env:
          EXPECTED_ACK_SHA: 5cb316cf9d39318326075731e4e0c39b725d9c99
        run: |
          set -euo pipefail
          git remote add ack-upstream https://android.googlesource.com/kernel/common.git
          git -c protocol.version=2 fetch --no-tags ack-upstream \
            +refs/heads/android14-5.15-lts:refs/remotes/ack/android14-5.15-lts
          ACK_SHA="$(git rev-parse refs/remotes/ack/android14-5.15-lts)"
          echo "Fetched ACK revision: $ACK_SHA"
          test "$ACK_SHA" = "$EXPECTED_ACK_SHA" || {
            echo "::error::Upstream branch changed. Expected $EXPECTED_ACK_SHA, got $ACK_SHA. Stop for review."
            exit 1
          }
          git cat-file -e "$ACK_SHA^{commit}"
          echo "ack_sha=$ACK_SHA" >> "$GITHUB_OUTPUT"
          echo "Disk after fetch:"
          df -h .

      - name: Publish history in sub-2-GiB first-parent increments
        id: publish
        env:
          ACK_SHA: ${{ steps.source.outputs.ack_sha }}
        run: |
          set -euo pipefail
          STAGING_REF="refs/heads/import/staging-android14-5.15-lts"
          REMOTE_STAGING="refs/remotes/origin/import/staging-android14-5.15-lts"
          MAX_PACK_BYTES=1300000000
          INITIAL_SPAN=1000
          mkdir -p "$RUNNER_TEMP/ack-import"
          git rev-list --first-parent --reverse "$ACK_SHA" > "$RUNNER_TEMP/ack-import/first-parent.txt"
          mapfile -t FIRST_PARENT < "$RUNNER_TEMP/ack-import/first-parent.txt"
          TOTAL="${#FIRST_PARENT[@]}"
          test "$TOTAL" -gt 0
          echo "First-parent commits: $TOTAL"

          PREVIOUS=""
          START_INDEX=0
          EXISTING="$(git ls-remote origin "$STAGING_REF" | awk 'NR==1 {print $1}')"
          if [[ -n "$EXISTING" ]]; then
            FOUND=0
            for i in "${!FIRST_PARENT[@]}"; do
              if [[ "${FIRST_PARENT[$i]}" = "$EXISTING" ]]; then
                START_INDEX=$((i + 1))
                PREVIOUS="$EXISTING"
                FOUND=1
                break
              fi
            done
            if [[ "$FOUND" -ne 1 ]]; then
              echo "::error::Existing staging ref is not on the pinned first-parent chain; refusing to rewrite it."
              exit 1
            fi
            echo "Resuming from checkpoint $PREVIOUS at index $START_INDEX"
          fi

          pack_bytes_for() {
            local target="$1"
            if [[ -n "$PREVIOUS" ]]; then
              printf '%s\n^%s\n' "$target" "$PREVIOUS" |
                git pack-objects --stdout --revs --quiet | wc -c
            else
              printf '%s\n' "$target" |
                git pack-objects --stdout --revs --quiet | wc -c
            fi
          }

          INDEX="$START_INDEX"
          SPAN="$INITIAL_SPAN"
          PUSH_COUNT=0
          while [[ "$INDEX" -lt "$TOTAL" ]]; do
            END=$((INDEX + SPAN - 1))
            if [[ "$END" -ge "$TOTAL" ]]; then END=$((TOTAL - 1)); fi
            TARGET="${FIRST_PARENT[$END]}"
            PACK_BYTES="$(pack_bytes_for "$TARGET" | tr -d ' ')"
            echo "Checkpoint $((END + 1))/$TOTAL; estimated pack: $PACK_BYTES bytes; span=$((END - INDEX + 1))"

            if [[ "$PACK_BYTES" -gt "$MAX_PACK_BYTES" ]]; then
              if [[ "$SPAN" -le 1 ]]; then
                echo "::error::A single first-parent step exceeds the safe pack threshold. Requires a Git object/ancestry split strategy."
                exit 1
              fi
              SPAN=$(((SPAN + 1) / 2))
              echo "Reducing checkpoint span to $SPAN"
              continue
            fi

            PUSH_OK=0
            for ATTEMPT in 1 2 3; do
              if git push --porcelain origin "$TARGET:$STAGING_REF"; then
                PUSH_OK=1
                break
              fi
              REMOTE_NOW="$(git ls-remote origin "$STAGING_REF" | awk 'NR==1 {print $1}')"
              if [[ "$REMOTE_NOW" = "$TARGET" ]]; then
                PUSH_OK=1
                break
              fi
              if [[ -n "$PREVIOUS" && "$REMOTE_NOW" != "$PREVIOUS" ]]; then
                echo "::error::Remote staging ref moved unexpectedly to $REMOTE_NOW"
                exit 1
              fi
              if [[ -z "$PREVIOUS" && -n "$REMOTE_NOW" ]]; then
                echo "::error::Unexpected remote staging ref $REMOTE_NOW"
                exit 1
              fi
              echo "Push attempt $ATTEMPT failed; retrying smaller increment if needed."
              sleep 12
            done

            if [[ "$PUSH_OK" -ne 1 ]]; then
              if [[ "$SPAN" -le 1 ]]; then
                echo "::error::Push failed even with a single first-parent increment."
                exit 1
              fi
              SPAN=$(((SPAN + 1) / 2))
              echo "Reducing checkpoint span after push failure to $SPAN"
              continue
            fi

            PREVIOUS="$TARGET"
            INDEX=$((END + 1))
            PUSH_COUNT=$((PUSH_COUNT + 1))
            SPAN="$INITIAL_SPAN"
            echo "Published checkpoint $PUSH_COUNT; next first-parent index=$INDEX"
            sleep 11
          done

          test "$PREVIOUS" = "$ACK_SHA"
          echo "All first-parent increments reached the pinned tip."
          echo "ack_sha=$ACK_SHA" >> "$GITHUB_OUTPUT"
          echo "push_count=$PUSH_COUNT" >> "$GITHUB_OUTPUT"
          echo "first_parent_count=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Promote completed history to permanent branches
        env:
          ACK_SHA: ${{ steps.source.outputs.ack_sha }}
        run: |
          set -euo pipefail
          STAGING_REF="refs/heads/import/staging-android14-5.15-lts"
          for REF in \
            refs/heads/upstream/android14-5.15-lts \
            refs/heads/deen/bringup-ack515-base; do
            EXISTING="$(git ls-remote origin "$REF" | awk 'NR==1 {print $1}')"
            if [[ -n "$EXISTING" && "$EXISTING" != "$ACK_SHA" ]]; then
              echo "::error::Destination $REF already points to a different commit ($EXISTING)."
              exit 1
            fi
            if [[ -z "$EXISTING" ]]; then
              git push origin "$ACK_SHA:$REF"
            fi
          done
          # Both permanent refs now retain the complete upstream ancestry.
          git push origin ":$STAGING_REF"

      - name: Record immutable import metadata
        env:
          ACK_SHA: ${{ steps.source.outputs.ack_sha }}
          PUSH_COUNT: ${{ steps.publish.outputs.push_count }}
          FIRST_PARENT_COUNT: ${{ steps.publish.outputs.first_parent_count }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          mkdir -p documentation
          cat > documentation/ACK_IMPORT_LOCK.md <<EOF
          # Android Common Kernel import lock

          - Upstream: https://android.googlesource.com/kernel/common
          - Upstream branch: `android14-5.15-lts`
          - Imported commit: `$ACK_SHA`
          - First-parent commits traversed: $FIRST_PARENT_COUNT
          - Incremental pushes: $PUSH_COUNT
          - Import method: full Git fetch followed by sequential first-parent checkpoints below GitHub's single-push limit.
          - Original upstream commit IDs, parent links and commit metadata are preserved.
          - Destination refs: `upstream/android14-5.15-lts` and `deen/bringup-ack515-base`

          This is a source import only. It does not claim Deen support has been ported or that the kernel boots on the device.
          EOF
          git add documentation/ACK_IMPORT_LOCK.md
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "docs: record imported ACK android14 5.15 LTS source lock"
            git push origin HEAD:refs/heads/main
          fi

      - name: Publish import summary
        env:
          ACK_SHA: ${{ steps.source.outputs.ack_sha }}
          PUSH_COUNT: ${{ steps.publish.outputs.push_count }}
          FIRST_PARENT_COUNT: ${{ steps.publish.outputs.first_parent_count }}
        run: |
          {
            echo "## Android Common Kernel 5.15 LTS import completed"
            echo
            echo "- Pinned commit: `$ACK_SHA`"
            echo "- First-parent checkpoints: $FIRST_PARENT_COUNT"
            echo "- Incremental Git pushes: $PUSH_COUNT"
            echo "- Permanent refs: `upstream/android14-5.15-lts`, `deen/bringup-ack515-base`"
          } >> "$GITHUB_STEP_SUMMARY"
